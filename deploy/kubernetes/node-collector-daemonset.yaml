# ventra-node-collector — sweeps every node (node plane).
#
# Mounts the host filesystem READ-ONLY at /host (VENTRA_NODE_ROOT), plus the CRI socket and the
# host journal. hostPID is enabled because some collectors need the host process view; keep it
# off if you do not run those. This is intentionally privileged — see namespace.yaml. Delete
# the DaemonSet after the engagement.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ventra-node-collector
  namespace: ventra-forensics
  labels:
    app.kubernetes.io/name: ventra-node-collector
    app.kubernetes.io/part-of: ventra
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ventra-node-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ventra-node-collector
    spec:
      serviceAccountName: ventra-collector
      hostPID: true
      # Tolerate control-plane taints so we also sweep control-plane nodes (audit log, etcd,
      # static pod manifests all live there).
      tolerations:
      - operator: Exists
      containers:
      - name: collector
        image: ghcr.io/ventra/node-collector:latest
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
          runAsUser: 0
          readOnlyRootFilesystem: true
        env:
        - name: VENTRA_NODE_ROOT
          value: /host
        - name: VENTRA_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        volumeMounts:
        - name: host-root
          mountPath: /host
          readOnly: true
        # Optional: only needed if you prefer crictl to reach the socket at its real path.
        # Ventra also reaches it through the /host mount and passes --runtime-endpoint
        # explicitly, so node-plane collection works without this mount.
        - name: containerd-sock
          mountPath: /run/containerd/containerd.sock
          readOnly: true
        - name: host-journal
          mountPath: /host/var/log/journal
          readOnly: true
        - name: evidence
          mountPath: /evidence
      volumes:
      - name: host-root
        hostPath:
          path: /
          type: Directory
      # The CRI socket is NOT in the same place on every distribution, and `type: Socket`
      # makes the kubelet refuse to start this pod when the path does not exist. Adjust the
      # path for your distribution, or delete this volume and its mount entirely:
      #
      #   kubeadm / most distros  /run/containerd/containerd.sock
      #   k3s, RKE2               /run/k3s/containerd/containerd.sock
      #   CRI-O                   /var/run/crio/crio.sock
      #   microk8s                /var/snap/microk8s/common/run/containerd.sock
      #
      # Ventra detects the socket under the read-only /host mount and points crictl at it
      # with --runtime-endpoint, so removing this volume costs nothing.
      - name: containerd-sock
        hostPath:
          path: /run/containerd/containerd.sock
          type: Socket
      - name: host-journal
        hostPath:
          path: /var/log/journal
          type: DirectoryOrCreate
      - name: evidence
        emptyDir: {}

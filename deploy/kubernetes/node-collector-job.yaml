# ventra-node-collector-job — targeted at ONE node (node plane).
#
# For single-pod / single-node deep dives (container filesystem capture, CRIU checkpoint).
# Modelled on the kube-forensics job-on-target-node pattern, but runtime-agnostic (crictl/CRI,
# never docker). Set spec.template.spec.nodeName to the target node before applying.
apiVersion: batch/v1
kind: Job
metadata:
  name: ventra-node-collector-job
  namespace: ventra-forensics
  labels:
    app.kubernetes.io/name: ventra-node-collector-job
    app.kubernetes.io/part-of: ventra
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ventra-node-collector-job
    spec:
      restartPolicy: Never
      serviceAccountName: ventra-collector
      # REQUIRED: pin to the node under investigation (the kubelet checkpoint endpoint is
      # reachable on localhost only, which is why the pod must land on the target node).
      nodeName: REPLACE_WITH_TARGET_NODE
      hostPID: true
      tolerations:
      - operator: Exists
      containers:
      - name: collector
        image: ghcr.io/ventra/node-collector:latest
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
          runAsUser: 0
        env:
        - name: VENTRA_NODE_ROOT
          value: /host
        - name: VENTRA_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        volumeMounts:
        - name: host-root
          mountPath: /host
          readOnly: true
        - name: containerd-sock
          mountPath: /run/containerd/containerd.sock
          readOnly: true
        - name: kubelet-checkpoints
          mountPath: /host/var/lib/kubelet/checkpoints
          readOnly: true
        - name: evidence
          mountPath: /evidence
      volumes:
      - name: host-root
        hostPath:
          path: /
          type: Directory
      - name: containerd-sock
        hostPath:
          path: /run/containerd/containerd.sock
          type: Socket
      - name: kubelet-checkpoints
        hostPath:
          path: /var/lib/kubelet/checkpoints
          type: DirectoryOrCreate
      - name: evidence
        emptyDir: {}

# ventra-node-collector-job — targeted at ONE node (node plane).
#
# For single-pod / single-node deep dives (targeted node-plane collection).
# Modelled on the kube-forensics job-on-target-node pattern, but runtime-agnostic (crictl/CRI,
# never docker). Set spec.template.spec.nodeName to the target node before applying.
apiVersion: batch/v1
kind: Job
metadata:
  name: ventra-node-collector-job
  namespace: ventra-forensics
  labels:
    app.kubernetes.io/name: ventra-node-collector-job
    app.kubernetes.io/part-of: ventra
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ventra-node-collector-job
    spec:
      restartPolicy: Never
      serviceAccountName: ventra-collector
      # REQUIRED: pin to the node under investigation.
      nodeName: REPLACE_WITH_TARGET_NODE
      hostPID: true
      tolerations:
      - operator: Exists
      containers:
      - name: collector
        image: ghcr.io/ventra/node-collector:latest
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
          runAsUser: 0
        env:
        - name: VENTRA_NODE_ROOT
          value: /host
        - name: VENTRA_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        volumeMounts:
        - name: host-root
          mountPath: /host
          readOnly: true
        - name: containerd-sock
          mountPath: /run/containerd/containerd.sock
          readOnly: true
        - name: evidence
          mountPath: /evidence
      volumes:
      - name: host-root
        hostPath:
          path: /
          type: Directory
      # The CRI socket path varies by distribution and `type: Socket` blocks the pod from
      # starting when it does not exist (k3s and RKE2 use /run/k3s/containerd/containerd.sock,
      # CRI-O /var/run/crio/crio.sock, microk8s its own snap path). Adjust it, or delete this
      # volume and its mount: Ventra finds the socket under the read-only /host mount and
      # passes --runtime-endpoint to crictl itself.
      - name: containerd-sock
        hostPath:
          path: /run/containerd/containerd.sock
          type: Socket
      - name: evidence
        emptyDir: {}

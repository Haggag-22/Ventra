# Optional Ventra → Elastic helpers.
#
# Elastic exports from ventra-export / the console are already ECS-shaped
# (schemas/unified-event.schema.json). Use this filter only when you need extra
# customer-specific remapping, or when loading an *older* flat NDJSON export.
#
#   logstash -f ventra-common.conf -f ventra-unified.conf
#
# For a straight load of current ECS NDJSON, you can skip this file and use
# ventra-unified.conf alone (or bulk-upload the files with no Logstash).

filter {
  # Legacy flat → ECS (no-ops when fields are already nested).
  if [event_action] and ![event][action] {
    mutate { rename => { "event_action" => "[event][action]" } }
  }
  if [event_outcome] and ![event][outcome] {
    mutate { rename => { "event_outcome" => "[event][outcome]" } }
  }
  if [event_kind] and ![event][kind] {
    mutate { rename => { "event_kind" => "[event][kind]" } }
  }
  if [event_provider] and ![event][provider] {
    mutate { rename => { "event_provider" => "[event][provider]" } }
  }
  if [event_severity] and ![event][severity] {
    mutate { rename => { "event_severity" => "[event][severity]" } }
  }
  if [event_category] and ![event][category] {
    if [event_category] =~ /^\[/ {
      json { source => "event_category" target => "[event][category]" remove_field => ["event_category"] }
    } else {
      mutate { rename => { "event_category" => "[event][category]" } }
    }
  }

  if [user_name] and ![user][name] {
    mutate { rename => { "user_name" => "[user][name]" } }
  }
  if [user_id] and ![user][id] {
    mutate { rename => { "user_id" => "[user][id]" } }
  }
  if [user_arn] and ![user][arn] {
    mutate { rename => { "user_arn" => "[user][arn]" } }
  }
  if [user_type] and ![user][type] {
    mutate { rename => { "user_type" => "[user][type]" } }
  }

  if [source_ip] and ![source][ip] {
    mutate { rename => { "source_ip" => "[source][ip]" } }
  }
  if [source_country] and ![source][geo][country_iso_code] {
    mutate { rename => { "source_country" => "[source][geo][country_iso_code]" } }
  }
  if [source_asn] and ![source][as][number] {
    mutate { rename => { "source_asn" => "[source][as][number]" } }
  }

  if [dest_ip] and ![destination][ip] {
    mutate { rename => { "dest_ip" => "[destination][ip]" } }
  }
  if [dest_port] and ![destination][port] {
    mutate { rename => { "dest_port" => "[destination][port]" } }
  }
  if [dest_bytes] and ![destination][bytes] {
    mutate { rename => { "dest_bytes" => "[destination][bytes]" } }
  }

  if [cloud_region] and ![cloud][region] {
    mutate { rename => { "cloud_region" => "[cloud][region]" } }
  }
  if [cloud_account] and ![cloud][account][id] {
    mutate { rename => { "cloud_account" => "[cloud][account][id]" } }
  }
  if [cloud_service] and ![cloud][service][name] {
    mutate { rename => { "cloud_service" => "[cloud][service][name]" } }
  }
  if [cloud_provider] and ![cloud][provider] {
    mutate { rename => { "cloud_provider" => "[cloud][provider]" } }
  }

  if [resource_type] and ![resource][type] {
    mutate { rename => { "resource_type" => "[resource][type]" } }
  }
  if [resource_id] and ![resource][id] {
    mutate { rename => { "resource_id" => "[resource][id]" } }
  }
  if [resource_arn] and ![resource][arn] {
    mutate { rename => { "resource_arn" => "[resource][arn]" } }
  }

  if [ua_original] and ![user_agent][original] {
    mutate { rename => { "ua_original" => "[user_agent][original]" } }
  }
  if [ua_category] and ![user_agent][category] {
    mutate { rename => { "ua_category" => "[user_agent][category]" } }
  }

  if ![ventra][case_id] and [case_id] {
    mutate { rename => { "case_id" => "[ventra][case_id]" } }
  }
  if ![ventra][source] and [ventra_source] {
    mutate { rename => { "ventra_source" => "[ventra][source]" } }
  }

  if [timestamp] and ![@timestamp] {
    date { match => ["timestamp", "ISO8601"] target => "@timestamp" }
  }

  if [related_ip] and ![related][ip] {
    if [related_ip] =~ /^\[/ {
      json { source => "related_ip" target => "[related][ip]" remove_field => ["related_ip"] }
    } else {
      mutate { rename => { "related_ip" => "[related][ip]" } }
    }
  }
  if [related_user] and ![related][user] {
    if [related_user] =~ /^\[/ {
      json { source => "related_user" target => "[related][user]" remove_field => ["related_user"] }
    } else {
      mutate { rename => { "related_user" => "[related][user]" } }
    }
  }
  if [related_resource] and ![related][resource] {
    if [related_resource] =~ /^\[/ {
      json { source => "related_resource" target => "[related][resource]" remove_field => ["related_resource"] }
    } else {
      mutate { rename => { "related_resource" => "[related][resource]" } }
    }
  }

  mutate {
    add_field => { "[@metadata][index_prefix]" => "ventra" }
  }
}

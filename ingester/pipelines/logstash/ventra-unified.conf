# Ventra → Elastic SIEM (all normalized sources).
#
# Works with any NDJSON file produced by ventra-export (Elastic target = ECS-shaped).
# All sources share the same UnifiedEvent → ECS projection, so one pipeline covers
# CloudTrail, VPC flow, GuardDuty, GCP audit, Entra, etc.
#
# Current exports are already ECS — skip ventra-common.conf unless you need custom
# remapping or are loading a legacy flat NDJSON zip:
#
#   ventra-export --case-dir ./cases/<id> --out ./export
#   VENTRA_NDJSON=$PWD/export/*.ndjson \
#   ELASTIC_HOSTS=https://es:9200 \
#     logstash -f ingester/pipelines/logstash/ventra-unified.conf
#
# Optional legacy / customize path:
#     logstash -f ingester/pipelines/logstash/ventra-common.conf \
#              -f ingester/pipelines/logstash/ventra-unified.conf

input {
  file {
    path => "${VENTRA_NDJSON:/data/export/*.ndjson}"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => "json"
  }
}

output {
  elasticsearch {
    hosts => ["${ELASTIC_HOSTS:https://localhost:9200}"]
    index => "ventra-%{[ventra][source]}-%{+YYYY.MM.dd}"
    # Configure auth/TLS via environment in your deployment; never hardcode credentials.
  }
  # Uncomment for dry runs:
  # stdout { codec => rubydebug }
}

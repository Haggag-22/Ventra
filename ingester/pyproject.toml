[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ventra-ingester"
version = "0.1.0"
description = "Verify, parse, normalize, and load Ventra evidence packages for the analyst console."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Ventra contributors" }]
dependencies = [
    "pyarrow>=15.0",
    "duckdb>=0.10",
    "PyYAML>=6.0",
    "rich>=13.7",
]

[project.optional-dependencies]
zstd = ["zstandard>=0.22"]
enrich = ["geoip2>=4.8"]

[project.scripts]
ventra-ingest = "ventra_ingester.cli:ingest_main"
ventra-verify = "ventra_ingester.cli:verify_main"
ventra-ingest-watch = "ventra_ingester.ingest_watch:ingest_watch_main"
ventra-export = "ventra_ingester.cli:export_main"

[tool.hatch.build.targets.wheel]
packages = ["ventra_ingester"]

# Lint with the repo-wide settings (the root pyproject.toml).
[tool.ruff]
extend = "../pyproject.toml"

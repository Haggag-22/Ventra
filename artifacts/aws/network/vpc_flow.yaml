name: AWS.Network.VpcFlow
aliases:
- vpc_flow
- aws.vpc_flow
cloud: aws
category: Network
description: VPC Flow Logs configuration + recent CloudWatch flow records.
version: 1.0.0
collector: vpc_flow
type: vpc_flow
required_actions:
- ec2:DescribeFlowLogs
- ec2:DescribeVpcs
- logs:FilterLogEvents
- s3:ListBucket
- s3:GetObject
parameters:
  since:
    type: datetime
    required: false
  until:
    type: datetime
    required: false
  vpc_ids:
    type: list
    required: false
    description: VPC IDs whose flow logs should be collected.
  vpc_names:
    type: list
    required: false
    description: VPC Name tags resolved to VPC IDs before collection.
  flow_log_ids:
    type: list
    required: false
    description: Specific VPC Flow Log configuration IDs (fl-…).
  log_group_names:
    type: list
    required: false
    description: CloudWatch log group names or ARNs used as flow-log destinations.
  s3_bucket_names:
    type: list
    required: false
    description: S3 buckets used as VPC Flow Log destinations.
  destination_type:
    type: list
    required: false
    description: Limit to cloud-watch-logs or s3 destinations.
sources:
- type: vpc_flow
  format: json
severity: critical
estimated_volume: medium

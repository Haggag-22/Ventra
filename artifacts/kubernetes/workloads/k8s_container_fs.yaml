name: Kubernetes.Workloads.ContainerFilesystem
aliases:
- k8s_container_fs
- kubernetes.k8s_container_fs
cloud: kubernetes
category: Workloads
description: >-
  Container filesystem changes for implicated containers (on-prem exclusive): the OverlayFS
  upper (RW) layer, in-container shell history, and an optional full changed-layer export.
  Overlay paths are resolved at runtime via crictl inspect (never hardcoded). Every extracted
  file is sha256-hashed at acquisition.
version: 1.0.0
collector: k8s_container_fs
type: k8s_container_fs
required_actions: []
parameters:
  container_ids:
    type: list
    required: false
  container_upperdirs:
    type: list
    required: false
  namespaces:
    type: list
    required: false
  pods:
    type: list
    required: false
  full_export:
    type: bool
    required: false
    default: false
  allow_docker:
    type: bool
    required: false
    default: false
sources:
- type: k8s_container_fs
  format: json
severity: critical
estimated_volume: medium

name: Kubernetes.State.Rbac
aliases:
- k8s_rbac
- kubernetes.k8s_rbac
cloud: kubernetes
category: ClusterState
description: >-
  RBAC snapshot through the Kubernetes API: Roles, ClusterRoles, RoleBindings, ClusterRoleBindings
  and ServiceAccounts, with each object carrying the verdict the collector resolved for it. Flags
  subjects that can pivot to cluster-admin (exec into pods, read secrets cluster-wide, escalate or
  bind roles, impersonate) and any binding to system:anonymous or system:unauthenticated.
  Privilege escalation through RBAC is the most common post-exploitation move in a cluster, and
  the binding object itself is durable evidence. Needs nothing but a kubeconfig.
version: 1.0.0
collector: k8s_rbac
type: k8s_rbac
required_actions:
- list roles
- list clusterroles
- list rolebindings
- list clusterrolebindings
- list serviceaccounts
sources:
- type: k8s_rbac
  format: jsonl
severity: extended
estimated_volume: low

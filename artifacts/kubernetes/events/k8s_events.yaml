name: Kubernetes.Events.ClusterEvents
aliases:
- k8s_events
- kubernetes.k8s_events
cloud: kubernetes
category: Events
description: >-
  Kubernetes Events across all namespaces. The single most perishable artifact in the
  cluster — the API server garbage-collects Events after --event-ttl (default 1h). Warns
  explicitly when the incident window predates the effective TTL.
version: 1.0.0
collector: k8s_events
type: k8s_events
required_actions:
- get events
- list events
- watch events
parameters:
  since:
    type: datetime
    required: false
  until:
    type: datetime
    required: false
sources:
- type: k8s_events
  format: jsonl
severity: critical
estimated_volume: medium

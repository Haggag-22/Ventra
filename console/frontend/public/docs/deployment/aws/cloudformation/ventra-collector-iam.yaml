AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Ventra read-only collector IAM user and managed policy.
  Attach this policy to a dedicated IAM user for Ventra console authentication
  or kit collection. No write, create, delete, or modify permissions.

Parameters:
  UserName:
    Type: String
    Default: ventra-collector
    Description: IAM user name for Ventra authentication.
  CreateAccessKey:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Create an access key pair for the IAM user (store the secret securely).

Conditions:
  ShouldCreateAccessKey: !Equals [!Ref CreateAccessKey, "true"]

Resources:
  VentraCollectorPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: VentraCollectorReadOnly
      Description: Read-only permissions for Ventra AWS forensic collectors.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: VentraIdentityAndAccountContext
            Effect: Allow
            Action:
              - sts:GetCallerIdentity
              - iam:ListAccountAliases
              - organizations:DescribeOrganization
              - ec2:DescribeRegions
              - account:GetContactInformation
              - account:ListRegions
            Resource: "*"
          - Sid: VentraCloudTrail
            Effect: Allow
            Action:
              - cloudtrail:DescribeTrails
              - cloudtrail:GetTrailStatus
              - cloudtrail:GetTrail
              - cloudtrail:GetEventSelectors
              - cloudtrail:GetInsightSelectors
              - cloudtrail:ListTrails
              - cloudtrail:LookupEvents
            Resource: "*"
          - Sid: VentraVpcFlowAndNetwork
            Effect: Allow
            Action:
              - ec2:DescribeFlowLogs
              - ec2:DescribeVpcs
              - ec2:DescribeSubnets
              - ec2:DescribeNetworkInterfaces
              - ec2:DescribeSecurityGroups
              - ec2:DescribeInstances
              - ec2:DescribeInstanceAttribute
              - ec2:DescribeVolumes
              - ec2:DescribeSnapshots
              - ec2:DescribeSnapshotAttribute
              - ec2:DescribeImages
              - ec2:DescribeLaunchTemplates
              - ec2:DescribeLaunchTemplateVersions
              - ec2:DescribeAddresses
              - logs:FilterLogEvents
            Resource: "*"
          - Sid: VentraGuardDuty
            Effect: Allow
            Action:
              - guardduty:ListDetectors
              - guardduty:GetDetector
              - guardduty:ListFindings
              - guardduty:GetFindings
              - guardduty:GetFindingsStatistics
              - guardduty:ListFilters
              - guardduty:GetFilter
            Resource: "*"
          - Sid: VentraWAF
            Effect: Allow
            Action:
              - wafv2:ListWebACLs
              - wafv2:GetWebACL
              - wafv2:GetLoggingConfiguration
              - wafv2:ListLoggingConfigurations
              - wafv2:GetSampledRequests
            Resource: "*"
          - Sid: VentraIAMSnapshot
            Effect: Allow
            Action:
              - iam:GetAccountAuthorizationDetails
              - iam:ListUsers
              - iam:ListRoles
              - iam:ListGroups
              - iam:ListPolicies
              - iam:ListAttachedUserPolicies
              - iam:ListUserPolicies
              - iam:GetUserPolicy
              - iam:ListAttachedRolePolicies
              - iam:ListRolePolicies
              - iam:GetRolePolicy
              - iam:ListAttachedGroupPolicies
              - iam:ListGroupPolicies
              - iam:GetGroupPolicy
              - iam:ListGroupsForUser
              - iam:GetPolicy
              - iam:GetPolicyVersion
              - iam:GetRole
              - iam:ListAccessKeys
              - iam:GetAccessKeyLastUsed
              - iam:ListMFADevices
              - iam:GetAccountPasswordPolicy
              - iam:GenerateCredentialReport
              - iam:GetCredentialReport
            Resource: "*"
          - Sid: VentraTier2ReadOnly
            Effect: Allow
            Action:
              - config:DescribeConfigurationRecorders
              - config:DescribeDeliveryChannels
              - config:GetResourceConfigHistory
              - config:DescribeComplianceByConfigRule
              - securityhub:GetFindings
              - securityhub:DescribeHub
              - securityhub:GetEnabledStandards
              - macie2:GetMacieSession
              - macie2:ListFindings
              - macie2:GetFindings
              - detective:ListGraphs
              - detective:ListInvestigations
              - inspector2:ListFindings
              - inspector2:BatchGetAccountStatus
              - route53resolver:ListResolverQueryLogConfigs
              - route53resolver:ListResolverQueryLogConfigAssociations
              - eks:ListClusters
              - eks:DescribeCluster
              - logs:DescribeLogGroups
              - es:ListDomainNames
              - es:DescribeDomain
              - rds:DescribeDBInstances
              - dynamodb:ListTables
              - dynamodb:DescribeTable
              - network-firewall:ListFirewalls
              - network-firewall:DescribeLoggingConfiguration
              - elasticloadbalancing:DescribeLoadBalancers
              - elasticloadbalancing:DescribeLoadBalancerAttributes
              - elasticloadbalancing:DescribeListeners
              - cloudfront:ListDistributions
              - cloudfront:GetDistributionConfig
              - apigateway:GET
              - kms:ListKeys
              - kms:DescribeKey
              - kms:GetKeyPolicy
              - kms:ListGrants
              - secretsmanager:ListSecrets
              - secretsmanager:DescribeSecret
              - ssm:DescribeParameters
              - ssm:GetParameterHistory
              - lambda:ListFunctions
              - lambda:GetFunction
              - lambda:GetPolicy
              - s3:ListAllMyBuckets
              - s3:GetBucketLocation
              - s3:GetBucketPolicy
              - s3:GetBucketPolicyStatus
              - s3:GetBucketAcl
              - s3:GetBucketLogging
              - s3:GetBucketPublicAccessBlock
              - s3:GetBucketObjectLockConfiguration
            Resource: "*"
          - Sid: VentraReadLogObjects
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:ListBucket
            Resource:
              - arn:aws:s3:::*-logs
              - arn:aws:s3:::*-logs/*
              - arn:aws:s3:::*cloudtrail*
              - arn:aws:s3:::*cloudtrail*/*
              - arn:aws:s3:::*flow-log*
              - arn:aws:s3:::*flow-log*/*
              - arn:aws:s3:::*access-log*
              - arn:aws:s3:::*access-log*/*
              - arn:aws:s3:::*lb-logs*
              - arn:aws:s3:::*lb-logs*/*

  VentraCollectorUser:
    Type: AWS::IAM::User
    Properties:
      UserName: !Ref UserName
      ManagedPolicyArns:
        - !Ref VentraCollectorPolicy

  VentraCollectorAccessKey:
    Type: AWS::IAM::AccessKey
    Condition: ShouldCreateAccessKey
    Properties:
      UserName: !Ref VentraCollectorUser

Outputs:
  UserName:
    Description: IAM user for Ventra authentication.
    Value: !Ref VentraCollectorUser
  PolicyArn:
    Description: Managed policy ARN (attach to a role instead if preferred).
    Value: !Ref VentraCollectorPolicy
  AccessKeyId:
    Condition: ShouldCreateAccessKey
    Description: Access key ID for Ventra console or kit credentials.
    Value: !Ref VentraCollectorAccessKey
  SecretAccessKey:
    Condition: ShouldCreateAccessKey
    Description: Secret access key. Store securely; shown once in stack outputs.
    Value: !GetAtt VentraCollectorAccessKey.SecretAccessKey
